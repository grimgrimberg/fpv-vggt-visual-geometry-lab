<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6DoF camera-proxy state space</title><style>
html{color-scheme:dark}body{margin:0;background:#071015;color:#dcecef;font:14px system-ui;padding:24px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid #28414a;padding-bottom:14px}h1{font-size:20px;margin:0}.warning{color:#f3b75f}main{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding-top:18px}figure{margin:0;border-top:1px solid #28414a;padding-top:10px}canvas{width:100%;height:260px;background:#09171c}figcaption{margin-bottom:8px;color:#9eb4bc}@media(max-width:800px){main{grid-template-columns:1fr}}</style></head><body>
<header><div><h1>6DoF camera-proxy state space</h1><div>Recovered pose review · raw/fitted/smoothed translations remain separate</div></div><div class="warning">relative only · body attitude unavailable</div></header>
<main><figure><figcaption>Relative position traces</figcaption><canvas id="position"></canvas></figure><figure><figcaption>Attitude traces (camera orientation, degrees)</figcaption><canvas id="attitude"></canvas></figure><figure><figcaption>XY relative phase portrait</figcaption><canvas id="phase"></canvas></figure><figure><figcaption>Relative speed and angular-rate proxy</figcaption><canvas id="rates"></canvas></figure></main>
<script>"use strict";(async()=>{const d=await fetch("pose_6dof_animation.json").then(r=>r.json()),S=d.samples;function plot(id,series,colors){const c=document.getElementById(id),x=c.getContext("2d"),q=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;c.width=w*q;c.height=h*q;x.scale(q,q);x.strokeStyle="#28414a";x.strokeRect(.5,.5,w-1,h-1);const all=series.flatMap(a=>a),lo=Math.min(...all),hi=Math.max(...all),span=Math.max(hi-lo,1e-9);series.forEach((a,j)=>{x.strokeStyle=colors[j];x.beginPath();a.forEach((v,i)=>{const px=8+(w-16)*i/Math.max(a.length-1,1),py=h-8-(h-16)*(v-lo)/span;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()})}plot("position",[S.map(s=>s.position_relative[0]),S.map(s=>s.position_relative[1]),S.map(s=>s.position_relative[2])],["#f26868","#54e5c2","#67a8ff"]);plot("attitude",[S.map(s=>s.euler_xyz_deg[0]),S.map(s=>s.euler_xyz_deg[1]),S.map(s=>s.euler_xyz_deg[2])],["#f26868","#54e5c2","#67a8ff"]);plot("rates",[S.map(s=>s.speed_relative),S.map(s=>s.angular_rate_proxy_deg_per_source_s)],["#54e5c2","#f3b75f"]);const p=document.getElementById("phase"),g=p.getContext("2d"),q=Math.min(devicePixelRatio||1,2),w=p.clientWidth,h=p.clientHeight;p.width=w*q;p.height=h*q;g.scale(q,q);const X=S.map(s=>s.position_relative[0]),Y=S.map(s=>s.position_relative[1]),xmin=Math.min(...X),xmax=Math.max(...X),ymin=Math.min(...Y),ymax=Math.max(...Y);g.strokeStyle="#54e5c2";g.beginPath();S.forEach((s,i)=>{const px=8+(w-16)*(X[i]-xmin)/Math.max(xmax-xmin,1e-9),py=h-8-(h-16)*(Y[i]-ymin)/Math.max(ymax-ymin,1e-9);i?g.lineTo(px,py):g.moveTo(px,py)});g.stroke()})()</script></body></html>
