<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FPV Visual Geometry Lab V2</title>
  <link rel="stylesheet" href="assets/cockpit.css">
</head>
<body>
  <main id="app" class="shell">
    <aside class="rail">
      <div class="brand">
        <span>FPV Visual Geometry Lab</span>
        <b>V2 research cockpit</b>
      </div>
      <input id="search" type="search" placeholder="Search scene, town, method" autocomplete="off">
      <div class="filters">
        <button type="button" data-filter="all" class="active">All</button>
        <button type="button" data-filter="detailed">3D</button>
        <button type="button" data-filter="manual">Manual</button>
      </div>
      <div id="scene-list" class="scene-list" aria-label="Scene catalog"></div>
    </aside>
    <section class="stage">
      <header class="topbar">
        <div>
          <div id="kicker" class="kicker">loading catalog</div>
          <h1 id="title">FPV Visual Geometry Lab</h1>
        </div>
        <div id="badges" class="badges"></div>
      </header>
      <section class="media-grid">
        <article class="video-panel">
          <video id="video" controls preload="metadata" playsinline></video>
          <div id="timeline" class="timeline"></div>
        </article>
        <article class="viewer-panel">
          <iframe id="scene-frame" title="Detailed local reconstruction cockpit"></iframe>
          <div id="empty-viewer" class="empty-viewer"></div>
        </article>
      </section>
      <section class="evidence-grid">
        <article>
          <h2>Research State</h2>
          <dl id="state-table"></dl>
        </article>
        <article>
          <h2>Method Coverage</h2>
          <div id="methods" class="method-chips"></div>
        </article>
        <article>
          <h2>Publication Boundary</h2>
          <p id="boundary"></p>
        </article>
      </section>
    </section>
  </main>
  <script src="assets/cockpit.js"></script>
</body>
</html>
